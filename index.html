<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Symulator Darta - Poważna Kariera</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #e0e0e0; padding: 20px; text-align: center; }
        .container { background: #252526; max-width: 700px; margin: 0 auto; padding: 25px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.8); border: 1px solid #333; }
        h1, h2, h3 { color: #4caf50; margin-top: 0; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; }
        button.start-btn { background-color: #4caf50; color: #111; border: none; padding: 12px 20px; margin: 15px 0; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; text-transform: uppercase; transition: 0.2s; }
        button.start-btn:hover { background-color: #45a049; }
        #error-msg { color: #ff5555; font-weight: bold; margin-bottom: 15px; }
        
        /* Ekrany */
        #ekran-hub, #ekran-raport, #ekran-qschool { display: none; }
        
        /* Statystyki */
        .stats-bar { display: flex; justify-content: space-between; background: #111; padding: 15px; border-radius: 6px; border-left: 4px solid #4caf50; margin-bottom: 20px; font-weight: bold; flex-wrap: wrap; }
        .stats-bar div { text-align: center; width: 20%; min-width: 80px; margin-bottom: 10px; }
        .stats-bar span { display: block; font-size: 18px; color: #fff; }
        .status-karty { width: 100% !important; text-align: left !important; color: #ff9800; font-size: 14px; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
        
        /* Wielkie przyciski ligowe */
        #wybor-lig { text-align: center; margin-top: 20px; }
        .big-btn { display: block; width: 100%; padding: 18px; margin: 12px 0; background-color: #333; color: #fff; border: 2px solid #4caf50; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; text-transform: uppercase; }
        .big-btn:hover { background-color: #4caf50; color: #111; }
        .qschool-btn { border-color: #ff9800; color: #ff9800; }
        .qschool-btn:hover { background-color: #ff9800; color: #111; }
        
        /* Tabela historii */
        table { width: 100%; border-collapse: collapse; margin-top: 25px; font-size: 13px; background: #1e1e1e; }
        th, td { border: 1px solid #444; padding: 10px; text-align: center; }
        th { background-color: #333; color: #4caf50; }
        tr:nth-child(even) { background-color: #2a2a2a; }
        
        .log-box { background: #111; padding: 15px; border-radius: 6px; text-align: left; margin-bottom: 15px; border: 1px solid #333; font-family: monospace; color: #4caf50; line-height: 1.5; height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

<script src="baza.js"></script>

<!-- EKRAN 1: TWORZENIE ZAWODNIKA -->
<div id="ekran-startowy" class="container">
    <h1>Kariera Dartera</h1>
    <h2>Kreator Zawodnika</h2>
    <div id="error-msg"></div>
    
    <div class="form-group">
        <label>Imię i nazwisko:</label>
        <input type="text" id="imie">
    </div>
    <div class="form-group">
        <label>Pseudonim:</label>
        <input type="text" id="pseudonim">
    </div>
    <div class="form-group">
        <label>Wiek:</label>
        <input type="number" id="wiek">
    </div>
    <div class="form-group">
        <label>Utwór Walk-on:</label>
        <input type="text" id="walk-on">
    </div>
    <div class="form-group">
        <label>Waga lotek:</label>
        <select id="waga">
            <option value="12g">12g</option>
            <option value="16g">16g</option>
            <option value="18g">18g</option>
            <option value="19g">19g</option>
            <option value="20g">20g</option>
            <option value="21g">21g</option>
            <option value="22g">22g</option>
            <option value="23g">23g</option>
            <option value="24g" selected>24g</option>
            <option value="25g">25g</option>
            <option value="26g">26g</option>
            <option value="27g">27g</option>
            <option value="30g">30g</option>
            <option value="32g">32g</option>
        </select>
    </div>
    <div class="form-group">
        <label>Marka lotek:</label>
        <select id="marka">
            <option value="Unicorn">Unicorn</option>
            <option value="Harrows" selected>Harrows</option>
            <option value="Winmau">Winmau</option>
            <option value="Target">Target</option>
            <option value="Loxley">Loxley</option>
            <option value="Red Dragon">Red Dragon</option>
            <option value="Shot">Shot</option>
            <option value="One80">One80</option>
            <option value="Cuesoul">Cuesoul</option>
            <option value="KGHM">KGHM</option>
        </select>
    </div>
    <div class="form-group">
        <label>Poziom startowy:</label>
        <select id="poziom">
            <option value="amator">Amator (Średnia 25-35)</option>
            <option value="barowy">Gracz barowy (Średnia 45-55)</option>
            <option value="potencjal">Zawodnik z potencjałem (Średnia 65-75)</option>
        </select>
    </div>

    <button class="start-btn" onclick="startKariery()">Rozpocznij Karierę</button>
</div>

<!-- EKRAN 2: HUB KARIERY -->
<div id="ekran-hub" class="container">
    <h1>Sezon <span id="numer-sezonu">1</span></h1>
    <h2 style="color: #aaa; font-size: 16px;"><span id="info-gracza"></span></h2>
    
    <div class="stats-bar">
        <div>Wiek<span><span id="stat-wiek">0</span></span></div>
        <div>Średnia<span><span id="stat-srednia">0</span></span></div>
        <div>Dable<span><span id="stat-dable">0</span>%</span></div>
        <div>Psychika<span><span id="stat-psychika">100</span></span></div>
        <div class="status-karty" id="status-karty">Status: Amator (Brak Karty PDC)</div>
    </div>
    
    <h3>Wybierz rozgrywki na ten rok:</h3>
    <div id="wybor-lig">
        <!-- Zawsze dostępne dla słabych graczy -->
        <button class="big-btn" onclick="rozegrajSezon(5, 'Rozgrywki Amatorskie (Tier 5)')">Rozgrywki Amatorskie (Boty, Pub, Dartcounter) - TIER 5</button>
        <button class="big-btn" onclick="rozegrajSezon(4, 'Turnieje Lokalne (Tier 4)')">Turnieje Lokalne (PDC Poznań, Świebodzki) - TIER 4</button>
        <button class="big-btn" onclick="rozegrajSezon(3, 'Rozgrywki Krajowe (Tier 3)')">Poważne Ligi Krajowe (Bielsko, POD) - TIER 3</button>
        
        <!-- Odblokowywane dynamicznie -->
        <button class="big-btn" id="btn-tier2" style="display: none;" onclick="rozegrajSezon(2, 'Przedsionek PDC (Tier 2)')">Przedsionek Profesjonalizmu (Modus, Rezerwa) - TIER 2</button>
        <button class="big-btn qschool-btn" id="btn-qschool" style="display: none;" onclick="wejdzNaQSchool()">Jedziesz na Q-School (Zdobądź Kartę PDC)</button>
        <button class="big-btn" id="btn-tier1" style="display: none; border-color: #00d2ff;" onclick="rozegrajSezon(1, 'Pro Tour PDC (Tier 1)')">Profesjonalny Tour PDC (Players Champ, ET) - TIER 1</button>
    </div>
    
    <h3>Historia Kariery</h3>
    <table>
        <thead>
            <tr>
                <th>Sezon</th>
                <th>Wiek</th>
                <th>Liga</th>
                <th>Największy Sukces</th>
                <th>Średnia</th>
            </tr>
        </thead>
        <tbody id="tabela-historii">
        </tbody>
    </table>
</div>

<!-- EKRAN 3: Q-SCHOOL (KLIKANKA) -->
<div id="ekran-qschool" class="container">
    <h1>PDC Qualifying School</h1>
    <h2>Walczysz o Tour Card</h2>
    
    <div id="qschool-log" class="log-box"></div>

    <button class="start-btn" id="btn-qschool-graj" onclick="grajDzienQSchool()">Graj Dzień <span id="qschool-dzien">1</span></button>
    <button class="start-btn" id="btn-qschool-powrot" style="display:none; background-color: #666;" onclick="wrocZQSchool()">Zakończ Q-School i wróć</button>
</div>

<!-- EKRAN 4: RAPORT Z SEZONU -->
<div id="ekran-raport" class="container">
    <h1>Koniec Sezonu</h1>
    <h2>Grudzień – podsumowanie startów</h2>
    
    <div id="raport-tresc" class="log-box"></div>

    <button class="start-btn" onclick="wrocDoHuba()">Przejdź do kolejnego sezonu</button>
</div>

<script>
    let gracz = { imie: "", pseudonim: "", walkon: "", waga: "", marka: "", wiek: 0, srednia: 0, dable: 0, psychika: 100, mecze: 0, kartaPDC: false };
    let sezon = 1;
    let historia = [];
    let qSchoolObecnyDzien = 1;

    function losujZPrzedzialu(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function startKariery() {
        let wiekInput = document.getElementById('wiek').value;
        let msg = document.getElementById('error-msg');
        
        if (!wiekInput) { msg.innerText = "Podaj wiek, bo system nie przepuści."; return; }
        gracz.wiek = parseInt(wiekInput);
        if (gracz.wiek < 13 || gracz.wiek > 80) { msg.innerText = "Wiek musi być między 13 a 80 lat."; return; }

        gracz.imie = document.getElementById('imie').value || "Nieznany";
        gracz.pseudonim = document.getElementById('pseudonim').value || "Brak";
        gracz.walkon = document.getElementById('walk-on').value || "Brak Muzyki";
        gracz.waga = document.getElementById('waga').value;
        gracz.marka = document.getElementById('marka').value;
        
        let poziom = document.getElementById('poziom').value;
        if (poziom === "amator") gracz.srednia = losujZPrzedzialu(25, 35);
        else if (poziom === "barowy") gracz.srednia = losujZPrzedzialu(45, 55);
        else gracz.srednia = losujZPrzedzialu(65, 75);
        
        gracz.dable = Math.max(5, Math.floor(gracz.srednia / 2.5) + losujZPrzedzialu(-5, 5));

        document.getElementById('ekran-startowy').style.display = 'none';
        odswiezHub();
        document.getElementById('ekran-hub').style.display = 'block';
    }

    function odswiezHub() {
        document.getElementById('numer-sezonu').innerText = sezon;
        document.getElementById('info-gracza').innerText = `${gracz.imie} "${gracz.pseudonim}" | Broń: ${gracz.marka} ${gracz.waga}`;
        document.getElementById('stat-wiek').innerText = gracz.wiek;
        document.getElementById('stat-srednia').innerText = gracz.srednia.toFixed(1);
        document.getElementById('stat-dable').innerText = gracz.dable;
        document.getElementById('stat-psychika').innerText = gracz.psychika;
        document.getElementById('status-karty').innerText = gracz.kartaPDC ? "Status: Zawodowiec (Tour Card Posiadana)" : "Status: Amator (Brak Karty PDC)";
        
        // Logika wyświetlania przycisków na bazie średniej
        document.getElementById('btn-tier2').style.display = (gracz.srednia >= 70) ? 'block' : 'none';
        document.getElementById('btn-qschool').style.display = (gracz.srednia >= 80 && !gracz.kartaPDC) ? 'block' : 'none';
        document.getElementById('btn-tier1').style.display = (gracz.kartaPDC) ? 'block' : 'none';

        // Odbudowa tabeli
        let tbody = document.getElementById('tabela-historii');
        tbody.innerHTML = "";
        historia.forEach(h => {
            tbody.innerHTML += `<tr>
                <td>${h.sezon}</td>
                <td>${h.wiek}</td>
                <td>${h.liga}</td>
                <td>${h.sukces}</td>
                <td>${h.srednia}</td>
            </tr>`;
        });
    }

    /* --- LOGIKA Q-SCHOOL --- */
    function wejdzNaQSchool() {
        document.getElementById('ekran-hub').style.display = 'none';
        document.getElementById('ekran-qschool').style.display = 'block';
        qSchoolObecnyDzien = 1;
        document.getElementById('qschool-dzien').innerText = qSchoolObecnyDzien;
        document.getElementById('btn-qschool-graj').style.display = 'block';
        document.getElementById('btn-qschool-powrot').style.display = 'none';
        document.getElementById('qschool-log').innerHTML = `Witaj w Kalkar. Masz 4 dni, żeby przebić się przez gęste sito eliminacji. Aby wygrać finał i zgarnąć kartę, potrzebujesz w decydującym momencie rzucić średnią powyżej 85 punktów.<br><br>`;
    }

    function grajDzienQSchool() {
        let rzut = losujZPrzedzialu(-5, 12);
        let formaWDanymDniu = gracz.srednia + rzut;
        let log = document.getElementById('qschool-log');
        
        if (formaWDanymDniu >= 85) {
            log.innerHTML += `> DZIEŃ ${qSchoolObecnyDzien}: Absolutna forma życia! Rzucasz ze średnią ${formaWDanymDniu.toFixed(1)}. Niszczysz przeciwnika w finale.<br><b style="color:#00d2ff;">WYGRYWASZ KARTĘ PDC!</b><br><br>`;
            gracz.kartaPDC = true;
            gracz.psychika = 100; // Euforyczny boost
            zablokujKlikanieQSchool();
        } else {
            log.innerHTML += `> DZIEŃ ${qSchoolObecnyDzien}: Średnia zaledwie ${formaWDanymDniu.toFixed(1)}. Odpadasz przed decydującą fazą.<br>`;
            qSchoolObecnyDzien++;
            
            if (qSchoolObecnyDzien > 4) {
                log.innerHTML += `<br><span style="color:#ff5555;">Koniec Q-School. Limit dni wyczerpany. Wracasz do domu z pustymi rękami.</span>`;
                gracz.psychika -= 25;
                if (gracz.psychika < 0) gracz.psychika = 0;
                zablokujKlikanieQSchool();
            } else {
                document.getElementById('qschool-dzien').innerText = qSchoolObecnyDzien;
            }
        }
        log.scrollTop = log.scrollHeight;
    }

    function zablokujKlikanieQSchool() {
        document.getElementById('btn-qschool-graj').style.display = 'none';
        document.getElementById('btn-qschool-powrot').style.display = 'block';
    }

    function wrocZQSchool() {
        document.getElementById('ekran-qschool').style.display = 'none';
        document.getElementById('ekran-hub').style.display = 'block';
        
        // Wyjazd na Q-School traktujemy jako pełny sezon startowy
        historia.push({
            sezon: sezon,
            wiek: gracz.wiek,
            liga: "PDC Q-School",
            sukces: gracz.kartaPDC ? "ZDOBYCIE KARTY PDC" : "Brak kwalifikacji",
            srednia: gracz.srednia.toFixed(1)
        });
        
        gracz.wiek++;
        sezon++;
        odswiezHub();
    }
    /* ----------------------- */

    function rozegrajSezon(docelowyTier, nazwaLigi) {
        let dostepneTurnieje = bazaTurniejow.filter(t => t.tier === docelowyTier);
        // Jeśli T1 (Mamy kartę), możemy też grać rezerwy/majory
        if (docelowyTier === 1) dostepneTurnieje = bazaTurniejow.filter(t => t.tier <= 2);
        if (dostepneTurnieje.length === 0) dostepneTurnieje = bazaTurniejow;

        let iloscTurniejow = losujZPrzedzialu(8, 14);
        let rozegraneMecze = 0;
        let najwyzszyIndeksSukcesu = -1;
        let tekstNajwyzszegoSukcesu = "Kompletna klapa w każdym starcie";

        // Symulacja turniejów
        for (let i = 0; i < iloscTurniejow; i++) {
            let turniej = dostepneTurnieje[losujZPrzedzialu(0, dostepneTurnieje.length - 1)];
            let lokalnySukces = "Odpadnięcie w pierwszej rundzie";
            let lokalnyIndeks = -1;

            for (let j = 0; j < turniej.etapy.length; j++) {
                rozegraneMecze++;
                let rzut = losujZPrzedzialu(-6, 8); 
                if (gracz.srednia + rzut >= turniej.etapy[j].sr) {
                    lokalnyIndeks = j;
                    lokalnySukces = turniej.etapy[j].faza;
                    if (j === turniej.etapy.length - 1) lokalnySukces = "ZWYCIĘSTWO";
                } else {
                    break;
                }
            }

            if (lokalnyIndeks > najwyzszyIndeksSukcesu) {
                najwyzszyIndeksSukcesu = lokalnyIndeks;
                tekstNajwyzszegoSukcesu = `${lokalnySukces} (${turniej.nazwa})`;
            }
        }

        // Zmiany parametrów po sezonie
        let staraSrednia = gracz.srednia;
        let staraPsychika = gracz.psychika;

        let zmSredniej = losujZPrzedzialu(-1, 2);
        if (najwyzszyIndeksSukcesu >= 3) zmSredniej += losujZPrzedzialu(1, 3);
        if (najwyzszyIndeksSukcesu === -1) zmSredniej -= 1;
        
        let zmPsychiki = losujZPrzedzialu(-15, 10);
        if (najwyzszyIndeksSukcesu >= 3) zmPsychiki += 15;

        gracz.srednia += zmSredniej;
        gracz.psychika += zmPsychiki;
        gracz.mecze += rozegraneMecze;
        
        if (gracz.psychika > 100) gracz.psychika = 100;
        if (gracz.psychika < 0) gracz.psychika = 0;
        gracz.dable = Math.max(5, Math.floor(gracz.srednia / 2.5) + losujZPrzedzialu(-5, 5));

        historia.push({
            sezon: sezon,
            wiek: gracz.wiek,
            liga: nazwaLigi,
            sukces: tekstNajwyzszegoSukcesu,
            srednia: gracz.srednia.toFixed(1)
        });

        generujRaport(iloscTurniejow, rozegraneMecze, tekstNajwyzszegoSukcesu, staraSrednia, staraPsychika);
    }

    function generujRaport(turnieje, mecze, maxSukces, oldSr, oldPsy) {
        document.getElementById('ekran-hub').style.display = 'none';
        document.getElementById('ekran-raport').style.display = 'block';
        
        let zmianaSr = (gracz.srednia - oldSr).toFixed(1);
        let zmianaPsy = gracz.psychika - oldPsy;
        
        let kolorSr = zmianaSr >= 0 ? "#4caf50" : "#ff5555";
        let kolorPsy = zmianaPsy >= 0 ? "#4caf50" : "#ff5555";

        let raport = `> Rozegrane turnieje w sezonie: ${turnieje}<br>`;
        raport += `> Mecze w tym sezonie: ${mecze}<br>`;
        raport += `> <b style="color: #ffd700;">Największe osiągnięcie: ${maxSukces}</b><br><br>`;
        
        raport += `> Zmiana średniej: <span style="color:${kolorSr}">${zmianaSr > 0 ? '+'+zmianaSr : zmianaSr}</span> (Obecnie: ${gracz.srednia.toFixed(1)})<br>`;
        raport += `> Zmiana psychiki: <span style="color:${kolorPsy}">${zmianaPsy > 0 ? '+'+zmianaPsy : zmianaPsy}</span> (Stan: ${gracz.psychika}/100)<br>`;
        
        if (gracz.psychika < 25) {
            raport += `<br><span style="color: #ff5555;">> UWAGA: Skrajne wyczerpanie psychiczne. Otrząśnij się, bo skończysz z dartitis.</span>`;
        }

        document.getElementById('raport-tresc').innerHTML = raport;
        
        gracz.wiek++;
        sezon++;
    }

    function wrocDoHuba() {
        document.getElementById('ekran-raport').style.display = 'none';
        odswiezHub(); 
        document.getElementById('ekran-hub').style.display = 'block';
    }
</script>
</body>
</html>
